<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#0B1F3A"/>
  
  <!-- Gold ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.4"/>
  
  <!-- Bank building base -->
  <rect x="40" y="130" width="120" height="12" rx="2" fill="#C9A84C"/>
  
  <!-- Bank columns -->
  <rect x="52" y="90" width="10" height="42" rx="1" fill="#C9A84C"/>
  <rect x="72" y="90" width="10" height="42" rx="1" fill="#C9A84C"/>
  <rect x="92" y="90" width="10" height="42" rx="1" fill="#C9A84C"/>
  <rect x="112" y="90" width="10" height="42" rx="1" fill="#C9A84C"/>
  <rect x="132" y="90" width="10" height="42" rx="1" fill="#C9A84C"/>

  <!-- Roof / pediment -->
  <polygon points="100,55 148,88 52,88" fill="#C9A84C"/>
  
  <!-- Roof top line -->
  <rect x="44" y="86" width="112" height="6" rx="1" fill="#E2C97E"/>

  <!-- Star / emblem on pediment -->
  <circle cx="100" cy="74" r="6" fill="#0B1F3A"/>
  <circle cx="100" cy="74" r="3" fill="#C9A84C"/>

  <!-- Bottom steps -->
  <rect x="34" y="142" width="132" height="8" rx="2" fill="#E2C97E" opacity="0.7"/>
  <rect x="28" y="150" width="144" height="8" rx="2" fill="#C9A84C" opacity="0.5"/>
</svg>
